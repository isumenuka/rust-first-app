<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1f1d1a;
      --muted: #77716a;
      --line: #e4dfd6;
      --accent: #b7410e; /* Rust orange */
      --danger: #a3261b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614;
        --card: #211f1c;
        --ink: #ece8e1;
        --muted: #9b958c;
        --line: #35322d;
        --accent: #e0703a;
        --danger: #ef7b6e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 34rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .sub { margin: 0 0 1.5rem; color: var(--muted); }
    form { display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .error { min-height: 1.5rem; margin: 0.5rem 0 0; color: var(--danger); font-size: 0.9rem; }
    ul { list-style: none; margin: 1rem 0 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
    }
    li + li { margin-top: 0.5rem; }
    li input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { color: var(--muted); text-decoration: line-through; }
    li .remove {
      padding: 0.2rem 0.5rem;
      background: transparent;
      color: var(--muted);
    }
    li .remove:hover { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 1.5rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>To-do</h1>
    <p class="sub">Served by Rust + axum. The list lives in the server's memory, so restarting clears it.</p>

    <form id="add-form">
      <input id="title" type="text" placeholder="What needs doing?" maxlength="200" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <ul id="todos"></ul>
  </main>

  <script>
    const listEl = document.querySelector('#todos');
    const form = document.querySelector('#add-form');
    const titleInput = document.querySelector('#title');
    const errorEl = document.querySelector('#error');

    async function api(method, path, body) {
      const options = { method };
      if (body !== undefined) {
        options.headers = { 'Content-Type': 'application/json' };
        options.body = JSON.stringify(body);
      }
      const res = await fetch(path, options);
      if (res.status === 204) return null;
      const data = await res.json();
      if (!res.ok) throw new Error(data.error ?? res.statusText);
      return data;
    }

    function render(todos) {
      listEl.replaceChildren();
      if (todos.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'Nothing to do yet.';
        listEl.append(empty);
        return;
      }
      for (const todo of todos) {
        const item = document.createElement('li');
        item.classList.toggle('done', todo.done);

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = todo.done;
        box.setAttribute('aria-label', 'Mark done');
        box.addEventListener('change', () => run(() => api('POST', `/api/todos/${todo.id}/toggle`)));

        const text = document.createElement('span');
        text.textContent = todo.title; // textContent, never innerHTML, so titles can't inject HTML

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.textContent = 'Delete';
        remove.addEventListener('click', () => run(() => api('DELETE', `/api/todos/${todo.id}`)));

        item.append(box, text, remove);
        listEl.append(item);
      }
    }

    async function refresh() {
      render(await api('GET', '/api/todos'));
    }

    async function run(action) {
      errorEl.textContent = '';
      try {
        await action();
        await refresh();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      run(async () => {
        await api('POST', '/api/todos', { title: titleInput.value });
        titleInput.value = '';
      });
    });

    run(async () => {});
  </script>
</body>
</html>
